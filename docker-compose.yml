
networks:
  chaoscps-network:
    driver: bridge

services:
  db:
    image: postgres:16.3
    container_name: db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 7
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - chaoscps-network

  web:
    build: .
    container_name: web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    volumes:
      - .:/app
      - files_data:/app/files
    working_dir: /app
    command: ["gunicorn", "chaoscps.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]
    networks:
      - chaoscps-network
  
  migrate:
    build: .
    container_name: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    volumes:
      - .:/app
      - files_data:/app/files
    working_dir: /app
    command: ["python", "manage.py", "migrate"]
    networks:
      - chaoscps-network

  createsuperuser:
    build: .
    container_name: createsuperuser
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    volumes:
      - .:/app
      - files_data:/app/files
    working_dir: /app
    command: ["python", "manage.py", "createsuperuser", "--noinput"]
    networks:
      - chaoscps-network

volumes:
  postgres_data:
  files_data:
